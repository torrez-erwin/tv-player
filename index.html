<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Player</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://ssl.p.jwpcdn.com/player/v/8.38.2/jwplayer.js"></script>
</head>
<body>
  <div id="app">
    <div id="player-container">
      <div class="homeScreen" id="homeScreen">
        <h1>TV Player</h1>
        <span id="appError">Los canales no funcionan en este momento. Intentelo mas tarde...</span>
        <div class="loader"></div>
      </div>
      <div id="player"></div>
    </div>

    <div class="channelList" id="channelList"></div>

    <button class="menuToggle" id="menuToggle">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="channelNumber" id="channelNumber">
      <span></span>
    </div>

    <div class="programInfo" id="programInfo">
      <div class="programImage">
        <img class="programImageBanner" id="programBanner" src="">
        <img class="channelImage" id="channelLogo" src="">
      </div>
      <div class="programDescription">
        <h1 id="programTitle"></h1>
        <p id="programDesc"></p>
        <span id="programTime"></span>
      </div>
    </div>
  </div>

  <script src="js/channels.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
